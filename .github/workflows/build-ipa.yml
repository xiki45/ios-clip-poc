name: build-ipa

# 云端 macOS runner 自带 Xcode + iOS SDK + Homebrew，可在没有本地 Xcode 的机器上产出未签名 IPA。
# 触发：push 到 main/master，或在 Actions 页面点 "Run workflow"。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "---- targets ----"
          xcodebuild -list -project PocApp.xcodeproj

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project PocApp.xcodeproj \
            -target PocApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: 检查产物结构
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/PocApp.app"
          EXT="$APP/PlugIns/ClipKeyboard.appex"
          echo "---- .app ----"
          find "$APP" -maxdepth 2 | sort
          test -d "$EXT" || { echo "::error::扩展没有被嵌入到 .app/PlugIns"; exit 1; }
          echo "---- .appex ----"
          find "$EXT" -maxdepth 2 | sort
          test -f "$EXT/ClipKeyboard" || { echo "::error::缺少扩展可执行文件"; exit 1; }

      - name: 写入 entitlements（产出 ldid 版 + codesign 版）
        run: |
          set -euo pipefail
          SRC="build/Release-iphoneos/PocApp.app"
          APP_ENT="$PWD/PocApp/PocApp.entitlements"
          EXT_ENT="$PWD/ClipKeyboard/ClipKeyboard.entitlements"

          pack() {
            local dir="$1" out="$2"
            local abs_dir="$PWD/$dir"
            local abs_out="$PWD/$out"
            rm -rf "$abs_dir/Payload"
            mkdir -p "$abs_dir/Payload"
            cp -R "$abs_dir/PocApp.app" "$abs_dir/Payload/PocApp.app"
            ( cd "$abs_dir" && zip -qry "$abs_out" Payload && rm -rf Payload )
          }

          # ── A. ldid 版（TrollStore 传统做法，entitlements 写入 __TEXT 段）──
          rm -rf build/stage-ldid && mkdir -p build/stage-ldid
          cp -R "$SRC" build/stage-ldid/PocApp.app
          APP_L=build/stage-ldid/PocApp.app
          brew install ldid >/dev/null 2>&1 || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -S"$EXT_ENT" "$APP_L/PlugIns/ClipKeyboard.appex/ClipKeyboard"
            ldid -S"$APP_ENT" "$APP_L/PocApp"
            ldid -e "$APP_L/PocApp" > build/check-app-ldid.plist || true
            ldid -e "$APP_L/PlugIns/ClipKeyboard.appex/ClipKeyboard" > build/check-ext-ldid.plist || true
            pack build/stage-ldid PocApp-ldid.ipa
          else
            echo "::warning::ldid 不可用，跳过 ldid 版"
          fi

          # ── B. codesign 版（标准 blob，可被 codesign 验证）──
          rm -rf build/stage-cs && mkdir -p build/stage-cs
          cp -R "$SRC" build/stage-cs/PocApp.app
          APP_C=build/stage-cs/PocApp.app
          codesign --force --sign - --entitlements "$EXT_ENT" "$APP_C/PlugIns/ClipKeyboard.appex"
          codesign --force --sign - --entitlements "$APP_ENT" "$APP_C"
          pack build/stage-cs PocApp-codesign.ipa

          echo "---- 回读 codesign 版 ----"
          codesign -d --entitlements :- "$APP_C/PocApp" 2>/dev/null | tee build/check-app-codesign.plist || true
          codesign -d --entitlements :- "$APP_C/PlugIns/ClipKeyboard.appex" 2>/dev/null | tee build/check-ext-codesign.plist || true

          grep -q "clipboardpoc" build/check-app-codesign.plist   || { echo "::error::主程序 entitlements 缺失"; exit 1; }
          grep -q "clipboardpoc" build/check-ext-codesign.plist   || { echo "::error::扩展 entitlements 缺失"; exit 1; }

          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocApp-ipa
          path: |
            PocApp-codesign.ipa
            PocApp-ldid.ipa
            build/check-*.plist
          retention-days: 14

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
