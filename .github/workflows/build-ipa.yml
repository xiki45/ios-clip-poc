name: build-ipa

# 云端 macOS runner 自带 Xcode + iOS SDK + Homebrew，可在没有本地 Xcode 的机器上产出未签名 IPA。
# 触发：push 到 main/master，或在 Actions 页面点 "Run workflow"。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "---- targets ----"
          xcodebuild -list -project PocApp.xcodeproj

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project PocApp.xcodeproj \
            -target PocApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: 检查产物结构
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/PocApp.app"
          EXT="$APP/PlugIns/ClipKeyboard.appex"
          echo "---- .app ----"
          find "$APP" -maxdepth 2 | sort
          test -d "$EXT" || { echo "::error::扩展没有被嵌入到 .app/PlugIns"; exit 1; }
          echo "---- .appex ----"
          find "$EXT" -maxdepth 2 | sort
          test -f "$EXT/ClipKeyboard" || { echo "::error::缺少扩展可执行文件"; exit 1; }

      - name: 签名并打包（codesign）
        run: |
          set -euo pipefail
          SRC="build/Release-iphoneos/PocApp.app"
          APP_ENT="$PWD/PocApp/PocApp.entitlements"
          EXT_ENT="$PWD/ClipKeyboard/ClipKeyboard.entitlements"
          OUT="$PWD/PocApp.ipa"

          rm -rf build/stage && mkdir -p build/stage
          cp -R "$SRC" build/stage/PocApp.app
          APP=build/stage/PocApp.app

          # 嵌套签名：先 appex，再 App，顺序不能反
          codesign --force --sign - --entitlements "$EXT_ENT" "$APP/PlugIns/ClipKeyboard.appex"
          codesign --force --sign - --entitlements "$APP_ENT" "$APP"

          codesign -d --entitlements :- "$APP/PocApp" 2>/dev/null > build/check-app-entitlements.plist || true
          codesign -d --entitlements :- "$APP/PlugIns/ClipKeyboard.appex" 2>/dev/null > build/check-ext-entitlements.plist || true

          echo "---- App ----";   cat build/check-app-entitlements.plist || true
          echo "---- Ext ----";   cat build/check-ext-entitlements.plist || true
          grep -q "clipboardpoc" build/check-app-entitlements.plist || { echo "::error::主程序 entitlements 缺失"; exit 1; }
          grep -q "clipboardpoc" build/check-ext-entitlements.plist || { echo "::error::扩展 entitlements 缺失"; exit 1; }

          mkdir -p build/stage/Payload
          cp -R "$APP" build/stage/Payload/PocApp.app
          ( cd build/stage && zip -qry "$OUT" Payload && rm -rf Payload )
          ls -lh PocApp.ipa
          unzip -l PocApp.ipa | head -15

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocApp-ipa
          path: |
            PocApp.ipa
            build/check-*.plist
          retention-days: 14

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
