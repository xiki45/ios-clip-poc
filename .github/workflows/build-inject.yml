name: build-inject-dylib

# 只编译注入用 dylib，不碰 App。本地无 iOS SDK，所以跑云端。
on:
  push:
    branches: [ main, master ]
    paths: [ 'inject/**', '.github/workflows/build-inject.yml' ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译
        run: ./inject/compile.sh

      - name: 检查
        run: |
          file inject/WeTypeInject.dylib
          nm -gU inject/WeTypeInject.dylib | head -20 || true
          echo "---- strings ----"
          strings inject/WeTypeInject.dylib | grep -E "WBInputViewController|wtinject|INJECT-OK" | head

      - uses: actions/upload-artifact@v4
        with:
          name: WeTypeInject
          path: |
            inject/WeTypeInject.dylib
          retention-days: 14
